{# Autocomplete dropdown, swapped into #search-suggestions by HTMX as the user types. #}
{% if suggestions %}
<div class="absolute left-0 right-0 top-full mt-2 z-50 rounded-xl border border-white/10 bg-slate-900/95 backdrop-blur-xl shadow-2xl shadow-black/50 overflow-hidden"
     role="listbox" id="suggest-list">
    {% for name, kind, count in suggestions %}
    <button type="button" data-suggest-item data-term="{{ name }}"
            role="option"
            class="w-full flex items-center gap-3 px-4 py-2.5 text-left text-sm text-slate-200 hover:bg-indigo-500/15 focus:bg-indigo-500/15 focus:outline-none transition-colors border-b border-white/5 last:border-b-0">
        {% if kind == 'skill' %}
            <svg class="w-4 h-4 text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        {% elif kind == 'category' %}
            <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        {% else %}
            <svg class="w-4 h-4 text-cyan-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        {% endif %}
        <span class="flex-1 truncate font-medium">{{ name }}</span>
        <span class="text-xs text-slate-500 shrink-0">
            {% if kind == 'company' %}company &middot; {% elif kind == 'category' %}category &middot; {% endif %}{{ count }} job{{ count|pluralize }}
        </span>
    </button>
    {% endfor %}
</div>
{% endif %}
